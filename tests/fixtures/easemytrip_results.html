<!-- Trimmed from a live flight.easemytrip.com/FlightList/Index render, 2026-08-26.
     Keeps only the landmarks apix.collect.adapters.easemytrip relies on:
     the .fltResult row split, .txt-r4 carrier name, the code/number spans,
     .dura_md2 stops label, .txt-r6-n headline fare, and the "Lock Price"
     upsell whose number must NOT be read as a fare. -->
<div id="ResultDiv">

  <div class="row no-margn fltResult ng-scope">
    <div class="col-md-2 col-sm-2 col-xs-4">
      <span class="txt-r4 ng-binding">Air India Express</span>
      <span class="txt-r5"><span class="ng-binding">IX</span>-<span class="ng-binding">1080</span></span>
      <span class="txt-r5 ng-binding">ECONOMY</span>
    </div>
    <div class="col-md-7 col-sm-7 padd-lft airl-txt-n">
      <span class="txt-r2-n ng-binding">18:40</span>
      <span class="txt-r3-n ng-binding">New Delhi</span>
      <span class="dura_md ng-binding">02h 25m</span>
      <span class="dura_md2 ng-scope">Non-stop</span>
      <span class="txt-r2-n ng-binding">21:05</span>
      <span class="txt-r3-n ng-binding">Navi Mumbai</span>
    </div>
    <div class="col-md-2 col-sm-2 col-xs-5 mr5">
      <div class="col-md-10 col-sm-8 col-xs-9 txt-r6-n exPrc"><span class="ng-binding">6,079</span></div>
      <div class="cross-pr-grid"><div class="cross-pr-txt exPrc ng-binding">6,079</div></div>
      <span class="prclocktxv2">Lock Price &#8377;</span><span class="ng-binding">304</span>
    </div>
  </div>

  <div class="row no-margn fltResult ng-scope">
    <div class="col-md-2 col-sm-2 col-xs-4">
      <span class="txt-r4 ng-binding">IndiGo</span>
      <span class="txt-r5"><span class="ng-binding">6E</span>-<span class="ng-binding">6261</span></span>
      <span class="txt-r5 ng-binding">ECONOMY</span>
    </div>
    <div class="col-md-7 col-sm-7 padd-lft airl-txt-n">
      <span class="txt-r2-n ng-binding">06:15</span>
      <span class="txt-r3-n ng-binding">New Delhi</span>
      <span class="dura_md ng-binding">05h 40m</span>
      <span class="dura_md2 ng-scope">1 stop</span>
      <span class="txt-r2-n ng-binding">11:55</span>
      <span class="txt-r3-n ng-binding">Mumbai</span>
    </div>
    <div class="col-md-2 col-sm-2 col-xs-5 mr5">
      <div class="col-md-10 col-sm-8 col-xs-9 txt-r6-n exPrc"><span class="ng-binding">12,450</span></div>
      <span class="prclocktxv2">Lock Price &#8377;</span><span class="ng-binding">304</span>
    </div>
  </div>

</div>
