# APIx basket definition.
#
# WEIGHTS ARE PLACEHOLDERS. They are shaped to the published ordering of Indian
# domestic city-pair traffic but are NOT the actual DGCA figures. Before any
# published index run, replace `pax_share` with origin-destination passenger
# counts from the DGCA monthly Traffic Statistics release and re-normalise.
# `apix.index.aggregate` re-normalises weights on load, so partial edits are safe.

meta:
  index_name: "Real-time Airfare Price Index (APIx)"
  base_period: "2026-04-01"      # index = 100.0 on this date
  base_value: 100.0
  currency: INR
  weight_source: "PLACEHOLDER - substitute DGCA monthly O-D passenger traffic"
  weight_vintage: "2026-04"
  review_frequency: annual        # basket + weight revision cadence

# ---------------------------------------------------------------------------
# Source scope: which quoting sources the basket is weighted over.
#
# Leave `active` absent and the basket spans every source marked collectable in
# sources.yaml. Name sources here to weight over those only.
#
# This is a DELIBERATE, RECORDED decision, never an automatic one. A source that
# goes quiet for a day must be imputed — that is what imputation is for, and
# letting non-response quietly reshape the basket is precisely the bias the
# imputation scheme exists to prevent. Narrowing the basket is a different act:
# it says a source is not expected back, and it changes what the published index
# MEANS. So it belongs in version control, with a date and a reason.
#
# 2026-09-08 — narrowed to easemytrip.
#   air_india and yatra return zero usable quotes from the GitHub-hosted
#   runners: their robots.txt reads time out on every attempt, so the gate fails
#   closed and all 75 requests per source are recorded as non-responses. They
#   have contributed nothing to the Postgres history at any point.
#
#   Note what this key did NOT do. Because those two have never landed a quote,
#   pipeline.build_index was already deriving the same scope from the data and
#   weighting over easemytrip alone. Writing it down changed no published
#   number. What it changes is durability: the derived scope would silently
#   re-widen the moment one of them landed a single quote — re-admitting ~85% of
#   the weight as imputation mid-outage — and a scope inferred from whatever
#   responded is not a decision anyone made or can audit. This one is.
#
#   What the narrowing costs: the direct-vs-OTA channel dimension. Nothing else.
#   All six carriers survive, because EaseMyTrip quotes all six — 975 cells to
#   450 — and the published series is a single-channel index: fares as quoted by
#   one OTA. Not evidence about what airlines charge on their own sites, and any
#   commentary must say so.
#
#   What is ACTUALLY limiting publication is EaseMyTrip's own success rate.
#   It serves a handful of requests and then returns 403/429; after 3 consecutive
#   blocks runner.py stops the source for the day. On 2026-09-08 that was ok=3 of
#   75, so 15 of its ~324 cells were observed and the rest imputed — 91% and
#   unpublishable, and no basket width fixes that. On 2026-09-05 the same source
#   ran for eight minutes before blocking and the day published at 45%.
#   Narrowing the basket is not the fix for that; a different network may be.
#
#   REVERT THIS when air_india and yatra actually land quotes again — check with
#   `python scripts/check_reachability.py` from the candidate host AND confirm
#   non-zero quotes in the collection step, then delete the `active` key below.
#   See DEPLOY.md, "Runner network".
# ---------------------------------------------------------------------------
sources:
  active: [easemytrip]

# ---------------------------------------------------------------------------
# Route stratum: weighted by share of domestic O-D passengers.
# ---------------------------------------------------------------------------
routes:
  - pair: DEL-BOM
    origin: DEL
    destination: BOM
    pax_share: 0.148
    metro: true
  - pair: DEL-BLR
    origin: DEL
    destination: BLR
    pax_share: 0.126
    metro: true
  - pair: BOM-BLR
    origin: BOM
    destination: BLR
    pax_share: 0.098
    metro: true
  - pair: DEL-CCU
    origin: DEL
    destination: CCU
    pax_share: 0.087
    metro: true
  - pair: DEL-HYD
    origin: DEL
    destination: HYD
    pax_share: 0.081
    metro: true
  - pair: MAA-DEL
    origin: MAA
    destination: DEL
    pax_share: 0.077
    metro: true
  - pair: BLR-HYD
    origin: BLR
    destination: HYD
    pax_share: 0.058
    metro: true
  - pair: BOM-DEL-GOI
    origin: BOM
    destination: GOI
    pax_share: 0.054
    metro: false
  - pair: DEL-PNQ
    origin: DEL
    destination: PNQ
    pax_share: 0.049
    metro: false
  - pair: BOM-CCU
    origin: BOM
    destination: CCU
    pax_share: 0.046
    metro: true
  - pair: DEL-AMD
    origin: DEL
    destination: AMD
    pax_share: 0.044
    metro: false
  - pair: BLR-MAA
    origin: BLR
    destination: MAA
    pax_share: 0.041
    metro: true
  - pair: DEL-GAU
    origin: DEL
    destination: GAU
    pax_share: 0.033
    metro: false
  - pair: BOM-HYD
    origin: BOM
    destination: HYD
    pax_share: 0.032
    metro: false
  - pair: DEL-SXR
    origin: DEL
    destination: SXR
    pax_share: 0.026
    metro: false

# ---------------------------------------------------------------------------
# Advance-purchase stratum. Weights = share of bookings made at each window.
# Front-loaded toward short notice, which is what makes airfare inflation
# volatile relative to the rest of the Transport sub-group.
# ---------------------------------------------------------------------------
advance_windows:
  - days: 1
    label: T+1
    booking_share: 0.10
  - days: 7
    label: T+7
    booking_share: 0.22
  - days: 15
    label: T+15
    booking_share: 0.26
  - days: 30
    label: T+30
    booking_share: 0.27
  - days: 45
    label: T+45
    booking_share: 0.15

# ---------------------------------------------------------------------------
# Carrier stratum. Weights = domestic market share (DGCA monthly).
# A carrier we cannot legally collect still carries weight; its cells are
# imputed from the collectable cells in the same route x window stratum and
# the imputation share is reported. See METHODOLOGY.md, "Coverage bias".
# ---------------------------------------------------------------------------
carriers:
  - code: 6E
    name: IndiGo
    market_share: 0.635
  - code: AI
    name: Air India
    market_share: 0.148
  - code: QP
    name: Akasa Air
    market_share: 0.052
  - code: IX
    name: Air India Express
    market_share: 0.098
  - code: SG
    name: SpiceJet
    market_share: 0.031
  - code: UK
    name: Vistara (merged into AI)
    market_share: 0.036

# ---------------------------------------------------------------------------
# Cabin / fare family. Economy only for v1 — premium cabins have thin and
# erratic quote coverage on many domestic pairs.
# ---------------------------------------------------------------------------
cabins:
  - code: ECONOMY
    include: true
  - code: PREMIUM_ECONOMY
    include: false
  - code: BUSINESS
    include: false

# ---------------------------------------------------------------------------
# Quality-control thresholds. Applied in apix.normalize.qc.
# ---------------------------------------------------------------------------
qc:
  min_fare_inr: 800              # below this is a data error, not a fare
  max_fare_inr: 120000
  max_log_move_per_day: 1.10     # |ln(p_t/p_t-1)| cap before flagging
  mad_outlier_threshold: 4.0     # modified z-score on log fares within a cell
  min_quotes_per_cell: 1
  max_imputation_share_warn: 0.35
  max_imputation_share_fail: 0.60
